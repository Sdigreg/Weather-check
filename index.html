<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perth Morning Ride Check</title>
<style>
  :root {
    --bg: #eef0f2; --card: #ffffff; --text: #1d2329; --muted: #5d6873;
    --ride: #1f8a4c; --walk: #b7791f; --cafe: #c0392b; --archive: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181c; --card: #1f252b; --text: #e8ecef; --muted: #9aa5af;
      --ride: #4cc380; --walk: #e0a840; --cafe: #ee6b5c; --archive: #e0a840;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  .rules { color: var(--muted); font-size: .9rem; margin: 0 0 20px; line-height: 1.5; }
  #status { color: var(--muted); padding: 24px 0; }
  .note { color: var(--muted); font-size: .95rem; margin: 0 0 12px; }

  /* The "Archived results" banner that appears when saved numbers are used. */
  .archive-note {
    background: var(--card); border-left: 8px solid var(--archive);
    border-radius: 12px; padding: 14px 16px; margin: 0 0 16px;
    font-size: 1.02rem; line-height: 1.5;
  }
  .archive-note[hidden] { display: none !important; }
  .archive-note .archive-sub {
    display: block; color: var(--muted); font-size: .92rem; margin-top: 4px;
  }

  .day {
    display: flex; gap: 16px; align-items: center;
    background: var(--card); border-radius: 12px; padding: 16px;
    margin-bottom: 12px; border-left: 8px solid var(--muted);
  }
  .day.ride { border-left-color: var(--ride); }
  .day.walk { border-left-color: var(--walk); }
  .day.cafe { border-left-color: var(--cafe); }
  /* 200x200 slot: swap the emoji for <img> files later */
  .icon {
    flex: 0 0 200px; width: 200px; height: 200px;
    display: flex; align-items: center; justify-content: center;
    font-size: 110px; line-height: 1;
  }
  .icon img { width: 200px; height: 200px; }
  .info { flex: 1; min-width: 0; }
  .info h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .info p { margin: 2px 0; font-size: 1.15rem; }
  .verdict { font-weight: 700; margin-top: 8px !important; }
  .ride .verdict { color: var(--ride); }
  .walk .verdict { color: var(--walk); }
  .cafe .verdict { color: var(--cafe); }
  .muted { color: var(--muted); font-size: 1.15rem; }
  @media (max-width: 560px) {
    .day { flex-direction: column; text-align: center; }
    .icon { flex-basis: auto; }
  }
  footer { color: var(--muted); font-size: .8rem; margin: 16px 0 24px; }
</style>
</head>
<body>
<main>
  <h1>Perth morning ride check</h1>
  <p class="sub">6:00 AM to 10:00 AM, next 7 days</p>
  <p class="rules">Ride: rain chance 20% or less, wind 25 km/h or less.<br>
  Walk: rain chance 35% or less, wind 30 km/h or less.</p>
  <div id="status" role="status">Loading forecast...</div>
  <div id="archiveNote" class="archive-note" hidden></div>
  <div id="days"></div>
  <footer id="foot"></footer>
</main>

<script>
"use strict";

/* ============================================================
   1. SETTINGS
   ============================================================ */

const LAT = -31.9505, LON = 115.8605, TZ = "Australia/Perth";
const LOCATION_NAME = "Perth city";

const CYCLE_RAIN_MAX = 20, CYCLE_WIND_MAX = 25;
const WALK_RAIN_MAX = 35, WALK_WIND_MAX = 30;

/* How long we wait for the weather service, and how many goes we give it.
   Three tries x 30 seconds. Saved results are only used after all three fail. */
const REQUEST_TIMEOUT_MS = 30000;   // 30 seconds per try
const MAX_ATTEMPTS = 3;             // three tries, then fall back
const RETRY_DELAY_MS = 2000;        // short breather between tries

/* Both pages use the SAME key, so a good run on either page can help the other.
   Do not change this unless you change it on the commute page too. */
const ARCHIVE_KEY = "perth-morning-weather-archive-v1";

/* Optional shared cloud archive (see README for the 2-minute setup).
   While `enabled` is false, saved results stay in this browser only.
   `timeoutMs` is only the wait for that optional cloud copy - the weather
   service itself gets REQUEST_TIMEOUT_MS (30 seconds) per try. */
const CLOUD_ARCHIVE = {
  enabled: false,
  readUrl: "",
  writeUrl: "",
  timeoutMs: 15000
};

const PAGE_SOURCE = "main";
const PAGE_SOURCE_LABEL = "the main ride/walk page";

// ---- Big icons: replace each value with '<img src="ride.png" alt="">' etc. later ----
const ICONS = {
  ride: "🚴",
  walk: "👟",
  cafe: "☕"
};

/* ============================================================
   2. SMALL HELPERS
   ============================================================ */

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function ordinal(n) {
  const rem100 = n % 100;
  if (rem100 >= 11 && rem100 <= 13) return n + "th";
  switch (n % 10) {
    case 1: return n + "st";
    case 2: return n + "nd";
    case 3: return n + "rd";
    default: return n + "th";
  }
}

/* Turns a moment in time into the style used by the banner, e.g.
   "10th July 2026 - 4:35PM AWST". AWST is always Perth time (GMT+8). */
function formatAwstStamp(isoString) {
  const date = isoString ? new Date(isoString) : new Date();
  if (isNaN(date.getTime())) return "an unknown date";
  const parts = new Intl.DateTimeFormat("en-AU", {
    timeZone: TZ, day: "numeric", month: "long", year: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true
  }).formatToParts(date);
  const get = (type) => (parts.find((p) => p.type === type) || {}).value || "";
  const day = Number(get("day"));
  const period = get("dayPeriod").replace(/\./g, "").toUpperCase();
  return `${ordinal(day)} ${get("month")} ${get("year")} - ` +
         `${get("hour")}:${get("minute")}${period} AWST`;
}

function formatPerthTime(date) {
  return date.toLocaleTimeString("en-AU", {
    hour: "numeric", minute: "2-digit", timeZone: TZ
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function weatherInfo(code) {
  if (code === 0) return { icon: "☀️", desc: "Clear sky" };
  if (code === 1) return { icon: "☀️", desc: "Mainly clear" };
  if (code === 2) return { icon: "⛅", desc: "Partly cloudy" };
  if (code === 3) return { icon: "☁️", desc: "Overcast" };
  if ([45, 48].includes(code)) return { icon: "🌫️", desc: "Foggy" };
  if ([51, 53, 55].includes(code)) return { icon: "🌦️", desc: "Drizzle" };
  if ([61, 63, 65, 80, 81, 82].includes(code)) return { icon: "🌧️", desc: "Rain" };
  if ([95, 96, 99].includes(code)) return { icon: "⛈️", desc: "Thunderstorm" };
  return { icon: "☁️", desc: "Mixed" };
}

const avg = (a) => a.reduce((s, v) => s + v, 0) / a.length;
const round1 = (n) => Math.round(n * 10) / 10;

// Current date and hour in Perth, independent of the device's own clock settings
function perthNow() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", hourCycle: "h23"
  }).formatToParts(new Date());
  const get = (type) => parts.find((p) => p.type === type).value;
  return {
    date: `${get("year")}-${get("month")}-${get("day")}`,
    hour: Number(get("hour"))
  };
}

function dayLabel(dateStr, todayStr) {
  const [y, m, d] = todayStr.split("-").map(Number);
  const tomorrowStr = new Date(Date.UTC(y, m - 1, d + 1)).toISOString().slice(0, 10);
  if (dateStr === todayStr) return "Today";
  if (dateStr === tomorrowStr) return "Tomorrow";
  const [yy, mm, dd] = dateStr.split("-").map(Number);
  return new Date(Date.UTC(yy, mm - 1, dd)).toLocaleDateString("en-AU",
    { weekday: "long", day: "numeric", month: "short", timeZone: "UTC" });
}

/* ============================================================
   3. TALKING TO THE WEATHER SERVICE (with the 30-second limit)
   ============================================================ */

async function fetchForecast(url, onAttempt, options) {
  const opts = options || {};
  const timeoutMs = opts.timeoutMs || REQUEST_TIMEOUT_MS;
  const attempts = opts.attempts || MAX_ATTEMPTS;
  const retryDelayMs = opts.retryDelayMs === undefined ? RETRY_DELAY_MS : opts.retryDelayMs;

  let timeoutCount = 0;
  let lastMessage = "unknown problem";

  for (let attempt = 1; attempt <= attempts; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);

    try {
      const response = await fetch(url, { signal: controller.signal, cache: "no-store" });
      if (!response.ok) throw new Error("the weather service said " + response.status);
      return await response.json();
    } catch (err) {
      const timedOut = controller.signal.aborted || (err && err.name === "AbortError");
      if (timedOut) {
        timeoutCount++;
        lastMessage = "it took longer than 30 seconds";
      } else {
        lastMessage = err && err.message ? err.message : "unknown problem";
      }
      if (attempt < attempts) {
        if (onAttempt) onAttempt(attempt + 1, timedOut);
        await sleep(retryDelayMs);
      }
    } finally {
      clearTimeout(timer);
    }
  }

  const error = new Error(lastMessage);
  error.timeouts = timeoutCount;
  error.attempts = attempts;
  throw error;
}

/* ============================================================
   4. SAVED RESULTS (the fallback)
   ------------------------------------------------------------
   On a good run we store the hourly forecast in the browser's
   own storage, plus a timestamp. If a later run fails three
   times in a row, we show that saved copy instead.
   ============================================================ */

function makeArchive(hourly, info) {
  const now = new Date();
  return {
    version: 1,
    savedAtUtc: now.toISOString(),
    savedAtLabel: formatAwstStamp(now.toISOString()),
    source: info.source,
    sourceLabel: info.sourceLabel,
    location: {
      name: info.locationName,
      lat: info.lat,
      lon: info.lon,
      timezone: TZ
    },
    forecastDays: info.forecastDays,
    hourly: {
      time: Array.from(hourly.time),
      temperature_2m: Array.from(hourly.temperature_2m),
      precipitation_probability: Array.from(hourly.precipitation_probability),
      wind_speed_10m: Array.from(hourly.wind_speed_10m),
      wind_gusts_10m: Array.from(hourly.wind_gusts_10m),
      weather_code: Array.from(hourly.weather_code)
    }
  };
}

function isValidArchive(archive) {
  if (!archive || archive.version !== 1 || !archive.hourly) return false;
  const h = archive.hourly;
  if (!Array.isArray(h.time) || h.time.length === 0) return false;
  const fields = ["temperature_2m", "precipitation_probability",
                  "wind_speed_10m", "wind_gusts_10m", "weather_code"];
  return fields.every((field) => Array.isArray(h[field]) && h[field].length === h.time.length);
}

function saveArchiveLocally(archive) {
  try {
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
    return true;
  } catch (err) {
    return false;   // private browsing, or storage is full
  }
}

function readArchiveLocally() {
  try {
    const raw = localStorage.getItem(ARCHIVE_KEY);
    if (!raw) return null;
    const archive = JSON.parse(raw);
    return isValidArchive(archive) ? archive : null;
  } catch (err) {
    return null;
  }
}

function newestArchive(candidates) {
  const usable = candidates.filter((a) =>
    isValidArchive(a) && a.savedAtUtc && !isNaN(new Date(a.savedAtUtc).getTime()));
  if (usable.length === 0) return null;
  usable.sort((a, b) => new Date(b.savedAtUtc) - new Date(a.savedAtUtc));
  return usable[0];
}

/* ---- Optional cloud copy, so the PS1 script and both pages share one file ---- */

async function readArchiveFromCloud() {
  if (!CLOUD_ARCHIVE.enabled || !CLOUD_ARCHIVE.readUrl) return null;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), CLOUD_ARCHIVE.timeoutMs);
  try {
    const response = await fetch(CLOUD_ARCHIVE.readUrl, {
      signal: controller.signal, cache: "no-store"
    });
    if (!response.ok) return null;
    const archive = await response.json();
    return isValidArchive(archive) ? archive : null;
  } catch (err) {
    return null;   // the cloud is optional; never let it break the page
  } finally {
    clearTimeout(timer);
  }
}

async function writeArchiveToCloud(archive) {
  if (!CLOUD_ARCHIVE.enabled || !CLOUD_ARCHIVE.writeUrl) return false;
  const body = JSON.stringify(archive);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), CLOUD_ARCHIVE.timeoutMs);
  try {
    // "PUT" updates an existing basket; if this is the very first save,
    // the service may ask us to "POST" it instead.
    for (const method of ["PUT", "POST"]) {
      const response = await fetch(CLOUD_ARCHIVE.writeUrl, {
        method,
        headers: { "Content-Type": "application/json" },
        body,
        signal: controller.signal
      });
      if (response.ok) return true;
    }
    return false;
  } catch (err) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

/* ============================================================
   5. SHOWING THE FORECAST
   ============================================================ */

function buildDays(hourly, now, archived) {
  const days = {};
  hourly.time.forEach((t, i) => {
    const hour = Number(t.slice(11, 13));
    if (hour < 6 || hour > 9) return;
    const key = t.slice(0, 10);
    if (key < now.date) return;                                   // yesterday and older
    if (!archived && key === now.date && hour < now.hour) return; // already gone today
    const d = days[key] || (days[key] = { temps: [], rain: [], wind: [], gust: [], codes: [] });
    d.temps.push(hourly.temperature_2m[i]);
    d.rain.push(hourly.precipitation_probability[i]);
    d.wind.push(hourly.wind_speed_10m[i]);
    d.gust.push(hourly.wind_gusts_10m[i]);
    d.codes.push(hourly.weather_code[i]);
  });
  return days;
}

function renderDays(hourly, options) {
  const archived = !!(options && options.archived);
  const now = perthNow();
  const days = buildDays(hourly, now, archived);
  const keys = Object.keys(days).sort();

  const container = document.getElementById("days");
  container.innerHTML = "";

  if (keys.length === 0) return 0;

  if (!archived && !days[now.date]) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = "Today's 6:00–10:00 AM window has already passed.";
    container.appendChild(note);
  }

  keys.forEach((key) => {
    const d = days[key];
    const maxRain = Math.round(Math.max(...d.rain));
    const avgWind = round1(avg(d.wind));
    const maxGust = round1(Math.max(...d.gust));
    const avgTemp = round1(avg(d.temps));

    // most common weather code
    const counts = {};
    d.codes.forEach((c) => counts[c] = (counts[c] || 0) + 1);
    const modeCode = Number(Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0]);
    const wx = weatherInfo(modeCode);

    const canCycle = maxRain <= CYCLE_RAIN_MAX && avgWind <= CYCLE_WIND_MAX;
    const canWalk = maxRain <= WALK_RAIN_MAX && avgWind <= WALK_WIND_MAX;
    let cls, text;
    if (canCycle) { cls = "ride"; text = "Ride day: get on the bike"; }
    else if (canWalk) { cls = "walk"; text = "Walking weather: lace up the shoes"; }
    else { cls = "cafe"; text = "Cafe day: stay home"; }

    const el = document.createElement("div");
    el.className = "day " + cls;
    el.innerHTML =
      `<div class="icon">${ICONS[cls]}</div>` +
      `<div class="info">` +
        `<h2>${dayLabel(key, now.date)}</h2>` +
        `<p>${wx.icon} ${wx.desc}, ${avgTemp}°C average</p>` +
        `<p>💧 Rain: ${maxRain}% peak</p>` +
        `<p>💨 Wind: ${avgWind} km/h average <span class="muted">(gusts ${maxGust} km/h)</span></p>` +
        `<p class="verdict">${text}</p>` +
      `</div>`;
    container.appendChild(el);
  });

  return keys.length;
}

function showArchiveNote(archive, noUsableDays) {
  const el = document.getElementById("archiveNote");
  const stamp = archive.savedAtLabel || formatAwstStamp(archive.savedAtUtc);
  const from = archive.sourceLabel ? ` Saved by ${archive.sourceLabel}.` : "";
  const sub = noUsableDays
    ? "These saved numbers are too old to show any upcoming mornings."
    : `The live forecast couldn't be reached after ${MAX_ATTEMPTS} tries. ` +
      `These are the last good numbers we have.${from}`;

  el.innerHTML =
    `<strong>Archived results:</strong> Last ran on ${escapeHtml(stamp)}` +
    `<span class="archive-sub">${escapeHtml(sub)}</span>`;
  el.hidden = false;
}

function showFailure(status, err) {
  const timedOut = err && err.timeouts > 0;
  status.textContent = timedOut
    ? `The weather service didn't answer within 30 seconds, ${MAX_ATTEMPTS} times in a row. ` +
      `There are no saved results to fall back on yet, so please try again later.`
    : `Couldn't load the forecast (${err && err.message ? err.message : "unknown error"}). ` +
      `Check your internet connection and refresh. There are no saved results to fall back on yet.`;
}

/* ---- Footer: a quiet note about where the numbers came from ---- */
let localSaveState = "none";   // "none" | "saved" | "failed"
let cloudSaveState = "off";    // "off" | "pending" | "ok" | "failed"

function updateFooter(archived) {
  const bits = ["Source: open-meteo.com. Times are Perth local. Updated " + formatPerthTime(new Date())];
  if (archived) {
    bits.push("showing saved results");
  } else if (localSaveState === "saved") {
    bits.push("saved for next time");
  }
  if (CLOUD_ARCHIVE.enabled) {
    if (cloudSaveState === "ok") bits.push("shared archive updated");
    else if (cloudSaveState === "failed") bits.push("shared archive not updated");
    else if (cloudSaveState === "pending") bits.push("updating shared archive…");
  }
  document.getElementById("foot").textContent = bits.join(" · ");
}

/* ============================================================
   6. THE RUN
   ============================================================ */

const API_URL = "https://api.open-meteo.com/v1/forecast" +
  `?latitude=${LAT}&longitude=${LON}` +
  "&hourly=temperature_2m,precipitation_probability,wind_speed_10m,wind_gusts_10m,weather_code" +
  `&wind_speed_unit=kmh&timezone=${TZ}&forecast_days=7`;

async function load() {
  const status = document.getElementById("status");
  let hourly = null;
  let archived = null;

  try {
    const data = await fetchForecast(API_URL, (nextAttempt, timedOut) => {
      status.textContent = timedOut
        ? `Taking longer than 30 seconds. Trying again (${nextAttempt} of ${MAX_ATTEMPTS})…`
        : `Couldn't reach the weather service. Trying again (${nextAttempt} of ${MAX_ATTEMPTS})…`;
    });

    hourly = data && data.hourly;
    if (!hourly || !Array.isArray(hourly.time) || hourly.time.length === 0) {
      throw new Error("the forecast came back empty");
    }

    // Good run: keep a copy before we show anything.
    const archive = makeArchive(hourly, {
      source: PAGE_SOURCE,
      sourceLabel: PAGE_SOURCE_LABEL,
      locationName: LOCATION_NAME,
      lat: LAT,
      lon: LON,
      forecastDays: 7
    });
    localSaveState = saveArchiveLocally(archive) ? "saved" : "failed";

    if (CLOUD_ARCHIVE.enabled) {
      cloudSaveState = "pending";
      updateFooter(false);
      writeArchiveToCloud(archive).then((ok) => {
        cloudSaveState = ok ? "ok" : "failed";
        updateFooter(false);
      });
    }

    status.remove();
    const shown = renderDays(hourly, { archived: false });

    if (shown === 0) {
      const note = document.createElement("p");
      note.className = "note";
      note.textContent = "The forecast didn't include any morning hours. Please try again later.";
      document.getElementById("days").appendChild(note);
    }

    updateFooter(false);
    return;
  } catch (err) {
    // Failed all three tries: look for the newest saved copy we can find.
    archived = newestArchive([readArchiveLocally(), await readArchiveFromCloud()]);

    if (!archived) {
      showFailure(status, err);
      return;
    }
    hourly = archived.hourly;
  }

  status.remove();
  const shown = renderDays(hourly, { archived: true });
  showArchiveNote(archived, shown === 0);
  updateFooter(true);
}

load();
</script>
</body>
</html>
